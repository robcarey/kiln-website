<!doctype html>
<html lang="[[++cultureKey:default=`en`]]" data-bs-theme="dark">
<head>
  <meta charset="[[++modx_charset]]">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){try{var t=localStorage.getItem('kiln-scheme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-bs-theme',t);}}catch(e){}})();</script>
  [[SeoSuiteMeta]]
  <meta name="theme-color" content="#0b0806">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="[[++site_name]]">
  <meta property="og:title" content="[[*longtitle:default=`[[*pagetitle]]`]]">
  <meta property="og:description" content="[[*description:default=`[[++kiln.tagline]]`]]">
  <meta property="og:url" content="[[~[[*id]]? &scheme=`full`]]">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="[[++site_url]]assets/themes/kiln/images/og-kiln-v2.jpg">
  <meta property="og:image:secure_url" content="[[++site_url]]assets/themes/kiln/images/og-kiln-v2.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kiln — Heat up your dev stack. The local web stack for Windows and macOS, shown running its dashboard.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="[[*longtitle:default=`[[*pagetitle]]`]]">
  <meta name="twitter:description" content="[[*description:default=`[[++kiln.tagline]]`]]">
  <meta name="twitter:image" content="[[++site_url]]assets/themes/kiln/images/og-kiln-v2.jpg">
  <meta name="twitter:image:alt" content="Kiln — Heat up your dev stack. The local web stack for Windows and macOS, shown running its dashboard.">
  <link rel="icon" href="[[++kiln.base_theme_url]]images/favicon.ico" sizes="any">
  <link rel="icon" href="[[++kiln.theme_url]]images/kiln-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="[[++kiln.base_theme_url]]images/apple-touch-icon.png">
  <link rel="preload" href="[[++kiln.theme_url]]fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="[[++kiln.base_theme_url]]css/site.css">
  <link rel="stylesheet" href="[[++kiln.theme_url]]css/kiln-web.css?v=[[++kiln.asset_version]]">
</head>
