<section class="k-section" id="faq" aria-labelledby="faq-title">
  <div class="container">
    <header class="k-section-head" data-reveal>
      <span class="k-eyebrow">FAQ</span>
      <h2 class="k-h2" id="faq-title">Questions, <span class="k-heat-text">answered.</span></h2>
    </header>
    <div class="k-faq" data-reveal>
      <div class="accordion" id="kFaq">
        [[getImageList?
          &tvname=`faqs`
          &docid=`[[*id]]`
          &tpl=`migx.tpl.Faq`
        ]]
      </div>
    </div>
  </div>
  [[kiln.FaqSchema? &tv=`faqs`]]
</section>
