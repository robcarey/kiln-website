<div class="k-auth">
  <div class="k-card k-auth__card">
    <h2 class="k-auth__title">Forgot your password?</h2>
    <p class="k-auth__lede">Enter your email and we’ll send you a 4-letter code to set a new one.</p>
    [[+alert]]
    <form class="k-form k-auth__form" method="post" action="[[+url_forgot]]" novalidate>
      <input type="hidden" name="csrf" value="[[+csrf]]">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" name="email" id="email" value="[[+email]]" autocomplete="email" required autofocus>
      <button class="k-btn k-btn--heat k-btn--block" type="submit">Send my code</button>
    </form>
    <p class="k-auth__foot"><a href="[[+url_signin]]">Back to sign in</a></p>
  </div>
</div>
