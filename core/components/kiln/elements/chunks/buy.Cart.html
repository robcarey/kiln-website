<section class="k-card k-cart" id="cart" aria-labelledby="cart-title">
  <h2 class="k-cart__title" id="cart-title">Your cart</h2>
  <table class="k-cart__table">
    <tbody>[[+rows]]</tbody>
    <tfoot><tr><th>Total</th><td></td><td class="k-cart__money">[[+total]]</td><td></td></tr></tfoot>
  </table>
  <form method="post" class="k-cart__go">
    <input type="hidden" name="csrf" value="[[+csrf]]"><input type="hidden" name="do" value="checkout">
    <button class="k-btn k-btn--heat k-btn--lg" type="submit">[[+signed_in:is=`1`:then=`Check out`:else=`Sign in to check out`]]<svg aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
  </form>
  <p class="k-auth__hint">[[+has_annual:is=`1`:then=`Annual plans and teams renew each year until you cancel. `]]Your licence keys arrive by email and appear on your account page.</p>
</section>
