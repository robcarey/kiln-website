<article class="k-card k-tile[[+size:notempty=` k-tile--[[+size]]`]]" data-inview data-reveal>
  <div class="k-tile__viz" aria-hidden="true">[[$viz.[[+visual]]]]</div>
  <div class="k-tile__copy">
    <span class="k-tile__icon" aria-hidden="true"><svg><use href="#i-[[+icon:default=`zap`]]"/></svg></span>
    <h3>[[+title]][[+pro:is=`1`:then=`<span class="k-badge k-badge--pro k-tile__tag">PRO</span>`]]</h3>
    <p>[[+body]]</p>
  </div>
</article>
