<section class="k-cta" data-bs-theme="dark" aria-labelledby="cta-title">
  <video class="k-cta__video" data-k-video muted loop playsinline preload="none" poster="[[++kiln.theme_url]]images/poster-sparks.webp" aria-hidden="true">
    <source data-src="[[++kiln.theme_url]]video/kiln-hero.mp4" type="video/mp4">
  </video>
  <div class="container" data-reveal>
    <svg class="k-mark" aria-hidden="true"><use href="#k-mark"/></svg>
    <h2 id="cta-title">Fire it <span class="k-heat-text k-heat-text--shimmer">up.</span></h2>
    <p>Download Kiln free and have your first site running over HTTPS today.</p>
    <div class="k-cta__buttons">
      [[$cmp.DownloadButton]]
      <a class="k-btn k-btn--ghost k-btn--lg" href="[[~[[++kiln.page_compare]]]]">Free vs Pro</a>
    </div>
  </div>
</section>
